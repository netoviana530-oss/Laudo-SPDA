<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de Inspeção de SPDA</title>
<meta name="description" content="Relatório de inspeção de SPDA — ABNT NBR 5419">
<meta name="theme-color" content="#232833">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Laudo SPDA">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --ink:#16191F; --graphite:#232833; --surface:#EDEFF2; --card:#FFFFFF;
  --line:#D6DBE1; --line-2:#B9C0C9; --muted:#5A6472; --ink-2:#39414D;
  --copper:#A85B32; --copper-2:#8C4A28; --copper-tint:#F4E7DD;
  --steel:#1F5F7A; --steel-tint:#E1EDF3;
  --ok:#2C7A4B; --ok-tint:#E3F1E8;
  --warn:#B7791F; --warn-tint:#F7EEDB;
  --bad:#B23A2E; --bad-tint:#F7E3E0;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);-webkit-text-size-adjust:100%;line-height:1.45}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--steel);box-shadow:0 0 0 3px var(--steel-tint)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 5px 2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--graphite);color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0}
.spark{flex:0 0 auto;width:30px;height:30px;border-radius:7px;background:linear-gradient(160deg,var(--copper),var(--copper-2));
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.spark svg{width:17px;height:17px;display:block}
.brandmark .t{min-width:0}
.brandmark .t b{display:block;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark .t span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9aa4b2}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid transparent;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;background:#333a47;color:#e8ebef;white-space:nowrap}
.btn:hover{background:#3d4553}
.btn:hover{background:#3d4553}
.btn.primary{background:var(--copper);color:#fff}
.btn.primary:hover{background:var(--copper-2)}
.btn.ghost{background:transparent;border-color:#3d4553;color:#c8ccd3}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:50px;z-index:20;background:var(--ink);display:flex;gap:2px;overflow-x:auto;
  padding:0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;top:calc(50px + env(safe-area-inset-top))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:none;background:transparent;color:#8b94a3;padding:12px 13px;font-size:13px;font-weight:600;
  border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:7px}
.tab .n{font-family:var(--mono);font-size:11px;color:#5f6a7a}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--copper)}
.tab[aria-selected="true"] .n{color:var(--copper)}
.tab .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;font-family:var(--mono)}

/* ---------- verdict bar ---------- */
.verdict{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip b{font-family:var(--mono);font-weight:700}
.chip.status{border:none;color:#fff;padding:7px 14px}
.chip.s-ok{background:var(--ok)} .chip.s-warn{background:var(--warn)} .chip.s-bad{background:var(--bad)}

/* ---------- toast + modal ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.modal{position:fixed;inset:0;background:rgba(15,17,21,.55);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:360px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .box p{margin:0 0 16px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.modal .box .row{display:flex;gap:10px;justify-content:flex-end}
.modal .btn2{border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:650;border:1px solid var(--line);cursor:pointer}
.modal .btn2.no{background:#fff;color:var(--muted)}
.modal .btn2.yes{background:var(--copper);color:#fff;border-color:var(--copper)}

/* ---------- layout ---------- */
main{max-width:960px;margin:0 auto;padding:16px 14px 90px}
.panel{display:none;animation:fade .18s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:baseline;gap:12px;margin:2px 2px 14px}
.phead .k{font-family:var(--mono);font-size:12px;color:var(--copper);font-weight:700}
.phead h2{font-size:20px}
.phead p{margin:0;color:var(--muted);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card>h3{font-size:14px;letter-spacing:.02em;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;color:var(--ink)}
.card>h3::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--copper);flex:0 0 auto;transform:rotate(45deg)}
.card>h3.steel::before{background:var(--steel)}

.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:1/-1}
@media(max-width:640px){.grid,.grid.three,.grid.four{grid-template-columns:1fr}.span2{grid-column:auto}}

.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* measurement readout */
.readout{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.readout input{border:none;border-radius:0;font-family:var(--mono);font-weight:600;text-align:right;letter-spacing:.02em}
.readout input:focus{box-shadow:none}
.readout .unit{flex:0 0 auto;display:grid;place-items:center;padding:0 12px;background:var(--ink);color:#fff;
  font-family:var(--mono);font-size:13px;font-weight:700;min-width:52px}
.readout select.unit{appearance:none;-webkit-appearance:none;color:#fff;border:none;text-align:center;cursor:pointer}

/* dynamic item rows */
.item{border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;overflow:hidden;background:#fff}
.item>.ihead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#F7F8FA;border-bottom:1px solid var(--line)}
.item>.ihead .idx{font-family:var(--mono);font-weight:700;color:#fff;background:var(--ink);border-radius:6px;
  min-width:26px;height:26px;display:grid;place-items:center;font-size:12px}
.item>.ihead .ttl{font-weight:650;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item>.ibody{padding:12px}
.iconbtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:30px;font-size:16px;
  color:var(--muted);display:grid;place-items:center;line-height:1}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}
.addbtn{width:100%;border:1.5px dashed var(--line-2);background:#fff;border-radius:var(--r);padding:12px;
  color:var(--steel);font-weight:650;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.addbtn:hover{border-color:var(--steel);background:var(--steel-tint)}

/* result flags */
.flag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-family:var(--mono)}
.flag.ok{background:var(--ok-tint);color:var(--ok)}
.flag.bad{background:var(--bad-tint);color:var(--bad)}
.flag.na{background:#eef0f2;color:var(--muted)}
select.eval{font-weight:600}
select[data-nc="1"]{border-color:var(--bad);background:var(--bad-tint);color:var(--bad-2,#8f2c22);font-weight:600}

/* photos */
.ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfc}
.ph img{display:block;width:100%;height:150px;object-fit:cover}
.ph .rm{position:absolute;top:6px;right:6px;background:rgba(20,22,26,.72);color:#fff;border:none;border-radius:6px;
  width:28px;height:28px;font-size:16px;line-height:1}
.ph .cap{padding:8px;border-top:1px solid var(--line)}
.ph .cap input{border:none;padding:6px 4px;font-size:13px}
.ph .cap input:focus{box-shadow:none}
.photobox{border:1.5px dashed var(--line-2);border-radius:8px;padding:14px;text-align:center;background:#fff;color:var(--steel);
  font-weight:600;font-size:13px;cursor:pointer}
.photobox:hover{background:var(--steel-tint);border-color:var(--steel)}
.photobox input{display:none}
.thumbwrap{display:flex;gap:10px;align-items:center;margin-top:8px}
.thumbwrap img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

.logopreview{display:flex;align-items:center;gap:12px}
.logopreview img{max-height:56px;max-width:170px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}

.ref table{width:100%;border-collapse:collapse;font-size:12.5px}
.ref th,.ref td{border:1px solid var(--line);padding:7px 9px;text-align:center}
.ref th{background:#F2F4F6;font-weight:650}
.ref td:first-child{text-align:left;font-weight:600}

.nc-empty{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:600;background:var(--ok-tint);
  border:1px solid #bfe0cb;border-radius:8px;padding:14px}
.nc-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:3px solid var(--bad);
  border-radius:8px;padding:11px 12px;margin-bottom:8px;background:#fff}
.nc-row .src{font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--copper);border-radius:5px;padding:3px 7px;flex:0 0 auto;font-weight:700}
.nc-row .txt{font-size:13.5px}
.nc-row .txt b{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}

/* print header/cover (screen-hidden) */
.print-only{display:none}

/* ============ PRINT ============ */
@page{size:A4;margin:14mm 12mm}
@media print{
  :root{--surface:#fff}
  .no-print,.topbar,.tabs,.verdict,.addbtn,.iconbtn,.photobox,.rm,.actions{display:none !important}
  body{background:#fff;color:#000;font-size:11px}
  main{max-width:none;margin:0;padding:0}
  .panel{display:block !important;animation:none;page-break-before:always}
  #tab-capa{page-break-before:auto}
  .phead{border-bottom:1.5px solid #000;padding-bottom:6px;margin-bottom:10px}
  .phead .k{color:#000}
  .card{border:1px solid #999;box-shadow:none;break-inside:avoid;margin-bottom:10px;padding:11px}
  .card>h3{border-color:#999}
  .item,.nc-row,.ph{break-inside:avoid}
  input,select,textarea{border:none !important;padding:2px 0 !important;background:transparent !important;
    box-shadow:none !important;color:#000 !important;-webkit-appearance:none;appearance:none;resize:none;font-size:11px}
  textarea{min-height:0;height:auto;overflow:visible}
  label{color:#333;margin-bottom:1px}
  .readout{border:none} .readout .unit{background:#000;color:#fff;padding:0 8px;min-width:0}
  .readout input{text-align:left;padding-left:0 !important}
  .item>.ihead{background:#f0f0f0 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .item>.ihead .idx{background:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ph img{height:auto;max-height:210px}
  .flag,.chip,.nc-row .src,.spark{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-only{display:block}
  .print-cover{page-break-after:always;padding-top:10mm}
  .print-cover .pc-brand{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:12px}
  .print-cover .pc-brand img{max-height:64px;max-width:200px}
  .print-cover h1{font-size:26px;margin:26mm 0 4px;line-height:1.15}
  .print-cover .pc-sub{font-size:13px;color:#333;letter-spacing:.05em;text-transform:uppercase}
  .print-cover .pc-grid{margin-top:16mm;display:grid;grid-template-columns:1fr 1fr;gap:5mm 10mm}
  .print-cover .pc-grid .f b{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#555}
  .print-cover .pc-grid .f span{font-size:13px}
  .print-cover .pc-verdict{margin-top:14mm;border:2px solid #000;padding:10px 14px;font-size:14px;font-weight:700;text-align:center}
  .print-foot{position:fixed;bottom:4mm;left:0;right:0;font-size:8.5px;color:#666;text-align:center;border-top:.5px solid #ccc;padding-top:2px}
  .pilltab{display:none}
}
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="brandmark">
    <span class="spark" id="brandSpark"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#fff"/></svg></span>
    <span class="t"><b id="brandName">Sua Empresa</b><span id="brandTag">Inspeção de SPDA</span></span>
  </div>
  <div class="actions">
    <button class="btn ghost" onclick="novoRelatorio()">Novo</button>
    <button class="btn ghost" onclick="document.getElementById('fileIn').click()">Abrir</button>
    <button class="btn" onclick="salvarJSON()">Salvar</button>
    <button class="btn primary" onclick="imprimir()">Gerar PDF</button>
    <input type="file" id="fileIn" accept="application/json" style="display:none" onchange="abrirJSON(this)">
  </div>
</header>

<nav class="tabs no-print" id="tabs" role="tablist"></nav>

<div class="verdict no-print" id="verdict"></div>

<!-- print-only cover -->
<div class="print-only print-cover" id="printCover"></div>

<main id="main"></main>

<div class="toast no-print" id="toast" role="status" aria-live="polite"></div>
<div class="modal no-print" id="modal" role="dialog" aria-modal="true"><div class="box">
  <p id="modalMsg"></p>
  <div class="row"><button class="btn2 no" id="modalNo">Cancelar</button><button class="btn2 yes" id="modalYes">Confirmar</button></div>
</div></div>

<div class="print-only print-foot" id="printFoot"></div>

<script>
"use strict";

/* ---------------- estado ---------------- */
const TABS = [
  {id:"capa",       n:"01", label:"Capa"},
  {id:"instalacao", n:"02", label:"Instalação"},
  {id:"captores",   n:"03", label:"Captores"},
  {id:"descidas",   n:"04", label:"Descidas"},
  {id:"aterramento",n:"05", label:"Aterramento"},
  {id:"continuidade",n:"06",label:"Continuidade"},
  {id:"instrumentos",n:"07",label:"Instrumentos"},
  {id:"nc",         n:"08", label:"Não conformidades"},
  {id:"fotos",      n:"09", label:"Fotos"},
  {id:"parecer",    n:"10", label:"Parecer"},
];

function novo(){return {
  empresa:{nome:"",logo:"",crea:"",resp:"",contato:"",endereco:""},
  meta:{numero:"",revisao:"00",data:hoje(),inspetor:""},
  cliente:{nome:"",cnpj:"",endereco:"",contato:""},
  instalacao:{edificacao:"",uso:"",altura:"",area:"",perimetro:"",nivel:"",metodo:"",estrutura:"",
    normaOrigem:"",criterioLaudo:"",tipoEstrutura:"",tipoInspecao:"",enquadramento:"",dataUltima:"",periodicidade:"",dataProxima:"",clima:""},
  adequacao:{descidasMin:"",espacamento:"",distribuicao:"",anel:"",conexaoEnsaio:"",captacao:"",equipotencial:"",justificativa:""},
  captores:[], descidas:[],
  aterramento:{tipo:"",hastes:"",caixas:"",conexoes:"",solda:"",obs:"",foto:"",
    r_valor:"",r_unid:"Ω",r_metodo:"",r_instr:"",r_temp:"",r_umid:"",r_alvo:"10"},
  config:{contUnid:"Ω",contLimite:"1"},
  continuidade:[], instrumentos:[], fotos:[], ncManuais:[],
  parecer:{situacao:"",texto:"",recomendacoes:"",responsavel:"",crea:"",art:"",dataEmissao:hoje()}
};}
let R = novo();

function hoje(){const d=new Date();return d.toISOString().slice(0,10);}
function getP(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o);}
function setP(o,p,v){const ks=p.split(".");const last=ks.pop();let t=o;ks.forEach(k=>t=t[k]=t[k]??{});t[last]=v;}
function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtData(iso){if(!iso)return "—";const [y,m,d]=iso.split("-");return d&&m&&y?`${d}/${m}/${y}`:iso;}

/* opções + regras de NC */
const OPT={
  condicao:["Bom","Regular","Ruim"],
  corrosao:["Ausente","Leve","Moderada","Severa"],
  fixacao:["Adequada","Regular","Inadequada"],
  conexao:["Adequada","Regular","Inadequada"],
  simnao:["Sim","Não","N/A"],
};
const NC_RULE={
  condicao:v=>v==="Ruim",
  corrosao:v=>v==="Moderada"||v==="Severa",
  fixacao:v=>v==="Inadequada",
  conexao:v=>v==="Inadequada",
};

/* ---------------- render base ---------------- */
function renderTabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=TABS.map((t,i)=>`<button class="tab" role="tab" data-tab="${t.id}"
     aria-selected="${i===0?'true':'false'}" onclick="go('${t.id}')">
     <span class="n">${t.n}</span>${t.label}<span class="badge" id="badge-${t.id}" style="display:none"></span></button>`).join("");
}
let current="capa";
function go(id){
  current=id;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===id));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="tab-"+id));
  window.scrollTo({top:0,behavior:"smooth"});
}

/* helpers de campo */
function fInput(path,label,ph="",type="text",cls=""){
  return `<div class="${cls}"><label>${label}</label><input type="${type}" data-path="${path}" placeholder="${ph}"></div>`;
}
function fArea(path,label,ph="",cls="span2"){
  return `<div class="${cls}"><label>${label}</label><textarea data-path="${path}" placeholder="${ph}"></textarea></div>`;
}
function fSel(path,label,opts,cls="",ph="Selecionar…"){
  return `<div class="${cls}"><label>${label}</label><select data-path="${path}">
    <option value="">${ph}</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select></div>`;
}

/* ---------------- painéis estáticos ---------------- */
function buildPanels(){
  const m=document.getElementById("main");
  m.innerHTML=[
    panelCapa(), panelInstalacao(), panelDin("captores"), panelDin("descidas"),
    panelAterramento(), panelDin("continuidade"), panelDin("instrumentos"),
    panelNC(), panelDin("fotos"), panelParecer()
  ].join("");
  document.querySelector("#tab-capa").classList.add("active");
}

function panelHead(k,title,sub){return `<div class="phead"><span class="k">${k}</span><div><h2>${title}</h2><p>${sub}</p></div></div>`;}

function panelCapa(){return `<section class="panel" id="tab-capa">
  ${panelHead("01","Capa & identidade","Identidade da empresa, dados do relatório e do cliente.")}
  <div class="card"><h3>Identidade da empresa (white-label)</h3>
    <div class="grid">
      ${fInput("empresa.nome","Nome / razão social","Ex.: KVAR Automattic")}
      ${fInput("empresa.crea","CREA / registro","Ex.: CREA-PA 17184 D")}
      ${fInput("empresa.resp","Responsável técnico","Nome do eng. responsável")}
      ${fInput("empresa.contato","Contato","Telefone / e-mail")}
      ${fInput("empresa.endereco","Endereço","",'text','span2')}
      <div class="span2"><label>Logo (aparece na capa do PDF)</label>
        <div class="logopreview">
          <label class="photobox" style="flex:1">Selecionar logo

    body=`<div class="grid">
      ${wrap("Identificação / local",ctlInput(kind,i,"local",it.local,"Ex.: cumeeira, eixo 3"))}
      ${wrap("Tipo",ctlInput(kind,i,"tipo",it.tipo,"Ex.: haste Franklin"))}
      ${wrap("Condição",ctlSel(kind,i,"condicao",OPT.condicao,it.condicao))}
      ${wrap("Corrosão",ctlSel(kind,i,"corrosao",OPT.corrosao,it.corrosao))}
      ${wrap("Fixação",ctlSel(kind,i,"fixacao",OPT.fixacao,it.fixacao))}

      <div class="span2">${itemPhoto(kind,i,it.foto,"foto")}</div></div>`;

      ${wrap("Identificação / local",ctlInput(kind,i,"local",it.local,"Ex.: fachada oeste"))}
      ${wrap("Material",ctlInput(kind,i,"material",it.material,"Ex.: cobre nu"))}
      ${wrap("Seção (mm²)",ctlInput(kind,i,"secao",it.secao,"Ex.: 50"))}
      ${wrap("Condição",ctlSel(kind,i,"condicao",OPT.condicao,it.condicao))}
      ${wrap("Conexões",ctlSel(kind,i,"conexoes",OPT.conexao,it.conexoes))}
      ${wrap("Corrosão",ctlSel(kind,i,"corrosao",OPT.corrosao,it.corrosao))}
      <div class="span2">${wrap("Observações",ctlArea(kind,i,"obs",it.obs,"Detalhes…"))}</div>
      <div class="span2">${itemPhoto(kind,i,it.foto,"foto")}</div></div>`;
  }else if(kind==="continuidade"){
    const readV=`<div class="readout"><input type="number" step="0.001" data-list="${kind}" data-i="${i}" data-f="valor" value="${esc(it.valor)}" placeholder="0.000">
      <select class="unit" data-list="${kind}" data-i="${i}" data-f="unid">${["µΩ","mΩ","Ω"].map(u=>`<option ${u===it.unid?"selected":""}>${u}</option>`).join("")}</select></div>`;
    const readL=`<div class="readout"><input type="number" step="0.001" data-list="${kind}" data-i="${i}" data-f="limite" value="${esc(it.limite)}" placeholder="—">
      <span class="unit">${esc(it.unid||"mΩ")}</span></div>`;
    body=`<div class="grid">
      <div class="span2">${wrap("Trecho / subsistema",ctlSel(kind,i,"trecho",["Captação","Descida","Aterramento","Equipotencialização","Armadura estrutural (natural)","Outro"],it.trecho))}</div>
      ${wrap("Ponto A",ctlInput(kind,i,"a",it.a,"Ex.: captor cumeeira"))}

      ${wrap("Valor medido",readV)}

      ${wrap("Instrumento",ctlInput(kind,i,"instr",it.instr,"Micro-ohmímetro"))}
      ${wrap("Resultado",`<div style="padding-top:6px">${contFlag(it)}</div>`)}
      <div class="span2">${wrap("Observações",ctlArea(kind,i,"obs",it.obs,"Detalhes…"))}</div></div>`;

  }
  return `<div class="item"><div class="ihead"><span class="idx">${idx}</span><span class="ttl">${esc(title)}</span>${rm}</div><div class="ibody">${body}</div></div>`;
}

/* ---------------- avaliação / NC ---------------- */
function num(v){const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null;}
function isNCcont(it){const v=num(it.valor),l=num(it.limite);return v!=null&&l!=null&&v>l;}
function contFlag(it){
  const v=num(it.valor),l=num(it.limite);
  if(v==null)return `<span class="flag na">— sem medição</span>`;
  if(l==null)return `<span class="flag na">medido</span>`;
  return v>l?`<span class="flag bad">✕ não conforme</span>`:`<span class="flag ok">✓ conforme</span>`;
}

function collectNC(){
  const out=[];
  R.captores.forEach((it,i)=>{
    const id=it.local||it.tipo||("Captor "+(i+1));
    if(NC_RULE.condicao(it.condicao))out.push({src:"CAPTOR",label:id,det:"Condição: "+it.condicao});
    if(NC_RULE.corrosao(it.corrosao))out.push({src:"CAPTOR",label:id,det:"Corrosão: "+it.corrosao});
    if(NC_RULE.fixacao(it.fixacao))out.push({src:"CAPTOR",label:id,det:"Fixação: "+it.fixacao});
  });
  R.descidas.forEach((it,i)=>{
    const id=it.local||it.material||("Descida "+(i+1));
    if(NC_RULE.condicao(it.condicao))out.push({src:"DESCIDA",label:id,det:"Condição: "+it.condicao});
    if(NC_RULE.conexao(it.conexoes))out.push({src:"DESCIDA",label:id,det:"Conexões: "+it.conexoes});
    if(NC_RULE.corrosao(it.corrosao))out.push({src:"DESCIDA",label:id,det:"Corrosão: "+it.corrosao});
  });
  const a=R.aterramento;
  if(NC_RULE.conexao(a.conexoes))out.push({src:"ATERR.",label:"Sistema de aterramento",det:"Conexões: "+a.conexoes});
  if(NC_RULE.condicao(a.solda))out.push({src:"ATERR.",label:"Solda / conectores",det:"Estado: "+a.solda});
  {const v=num(a.r_valor),l=num(a.r_alvo);if(v!=null&&l!=null&&v>l)out.push({src:"ATERR.",label:"Resistência de aterramento",det:`${a.r_valor} ${a.r_unid} > alvo ${a.r_alvo} Ω`});}
  R.continuidade.forEach((it,i)=>{if(isNCcont(it))out.push({src:"CONTINUID.",label:`${it.a||"A"} → ${it.b||"B"}`,det:`${it.valor} ${it.unid} > limite ${it.limite} ${it.unid}`});});
  const adq=R.adequacao||{}, ADQ={descidasMin:"Nº mínimo de descidas (≥2)",espacamento:"Espaçamento entre descidas (NP)",distribuicao:"Distribuição das descidas no perímetro",anel:"Eletrodo de aterramento em anel (arranjo B)",conexaoEnsaio:"Conexões de ensaio (~1,5 m)",captacao:"Cobertura da captação",equipotencial:"Equipotencialização / DPS"};
  Object.keys(ADQ).forEach(k=>{if(adq[k]==="Não atende")out.push({src:"ADEQUAÇÃO",label:ADQ[k],det:"Não atende à norma vigente"});});
  R.ncManuais.forEach(it=>{if(it.descricao)out.push({src:"MANUAL",label:it.local||"—",det:it.descricao,sev:it.severidade,acao:it.acao});});
  return out;
}

function computeStatus(){
  const nc=collectNC();
  // badges por aba
  const counts={captores:0,descidas:0,aterramento:0,continuidade:0,instalacao:0,nc:nc.length};
  nc.forEach(x=>{if(x.src==="CAPTOR")counts.captores++;else if(x.src==="DESCIDA")counts.descidas++;
    else if(x.src==="ATERR.")counts.aterramento++;else if(x.src==="CONTINUID.")counts.continuidade++;else if(x.src==="ADEQUAÇÃO")counts.instalacao++;});
  Object.entries(counts).forEach(([k,v])=>{const b=document.getElementById("badge-"+k);if(b){b.style.display=v?"inline-block":"none";b.textContent=v;}});

  // verdict bar
  const cap=R.captores.length,des=R.descidas.length,med=R.continuidade.length;
  let scls="s-ok",stxt="Sem não conformidades";
  if(nc.length){scls=nc.length>2?"s-bad":"s-warn";stxt=nc.length+(nc.length>1?" não conformidades":" não conformidade");}
  document.getElementById("verdict").innerHTML=
    `<span class="chip status ${scls}">${stxt}</span>
     <span class="chip">Captores <b>${cap}</b></span>
     <span class="chip">Descidas <b>${des}</b></span>
     <span class="chip">Medições <b>${med}</b></span>
     <span class="chip">NP <b>${R.instalacao.nivel||"—"}</b></span>`;

  // resultado aterramento
  const at=document.getElementById("atResult");
  if(at){const v=num(R.aterramento.r_valor),l=num(R.aterramento.r_alvo);
    at.innerHTML=v==null?`<span class="flag na">— sem medição</span>`:(l==null?`<span class="flag na">medido</span>`:(v>l?`<span class="flag bad">✕ acima do alvo</span>`:`<span class="flag ok">✓ conforme</span>`));}

  // NC automáticas
  const box=document.getElementById("ncAuto");
  if(box){
    const auto=nc.filter(x=>x.src!=="MANUAL");
    box.innerHTML = auto.length? auto.map(x=>
      `<div class="nc-row"><span class="src">${x.src}</span><div class="txt"><b>${esc(x.label)}</b>${esc(x.det)}</div></div>`).join("")
      : `<div class="nc-empty">✓ Nenhuma não conformidade detectada automaticamente nos itens preenchidos.</div>`;
  }
  fillPrint(nc);
}

/* ---------------- fotos ---------------- */
function resize(file,cb){
  const rd=new FileReader();
  rd.onload=e=>{const img=new Image();img.onload=()=>{
    const max=1400;let w=img.width,h=img.height;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
    const c=document.createElement("canvas");c.width=w;c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    try{cb(c.toDataURL("image/jpeg",0.72));}catch(_){cb(e.target.result);}
  };img.onerror=()=>cb(e.target.result);img.src=e.target.result;};
  rd.readAsDataURL(file);
}
function setItemPhoto(kind,i,field,input){const f=input.files[0];if(!f)return;resize(f,d=>{R[kind][i][field]=d;renderList(kind);autosave();});}
function clearItemPhoto(kind,i,field){R[kind][i][field]="";renderList(kind);autosave();}
function setPhotoPath(path,input){const f=input.files[0];if(!f)return;resize(f,d=>{setP(R,path,d);
  const t=document.getElementById("thumb-"+path.replace(/\./g,"_"));if(t){t.style.display="flex";t.innerHTML=`<img src="${d}"><button class="iconbtn" onclick="clearPhotoPath('${path}')">✕</button>`;}autosave();});}
function clearPhotoPath(path){setP(R,path,"");const t=document.getElementById("thumb-"+path.replace(/\./g,"_"));if(t){t.style.display="none";t.innerHTML="";}autosave();}
function setLogo(input){const f=input.files[0];if(!f)return;resize(f,d=>{R.empresa.logo=d;syncBrand();autosave();});}

/* ---------------- brand ---------------- */
function syncBrand(){
  document.getElementById("brandName").textContent=R.empresa.nome||"Sua Empresa";
  const img=document.getElementById("logoImg");
  if(R.empresa.logo){img.src=R.empresa.logo;img.style.display="block";}else{img.style.display="none";}
}

/* ---------------- data binding (escalares) ---------------- */
function bindScalars(){
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.path){setP(R,t.dataset.path,t.value);onScalar(t.dataset.path);}
    else if(t.dataset.list){R[t.dataset.list][+t.dataset.i][t.dataset.f]=t.value;onListEdit(t.dataset.list,+t.dataset.i,t.dataset.f);}
  });
  document.addEventListener("change",e=>{ // selects em alguns browsers
    const t=e.target;
    if(t.tagName==="SELECT"){
      if(t.dataset.path){setP(R,t.dataset.path,t.value);onScalar(t.dataset.path);}
      else if(t.dataset.list){R[t.dataset.list][+t.dataset.i][t.dataset.f]=t.value;onListEdit(t.dataset.list,+t.dataset.i,t.dataset.f);}
    }
  });
}
let saveT=null;
function onScalar(path){
  if(path.startsWith("empresa.nome")||path.startsWith("empresa.logo"))syncBrand();
  if(path==="instalacao.enquadramento"||path==="meta.data"||path==="instalacao.criterioLaudo"||path==="instalacao.normaOrigem"||path==="instalacao.tipoEstrutura"||path==="instalacao.tipoInspecao"||path==="instalacao.nivel")computePeriodicidade();
  if(path==="instalacao.nivel"||path==="instalacao.perimetro")computeDescidas();
  computeStatus();autosaveDeb();
}
function onListEdit(kind,i,f){
  // re-render leve só quando muda unidade (limite espelha) — senão evita perder foco
  if(kind==="continuidade"&&f==="unid")renderList(kind);
  computeStatus();autosaveDeb();
}
function autosaveDeb(){clearTimeout(saveT);saveT=setTimeout(autosave,400);}

/* ---------------- persistência ---------------- */
function autosave(){try{localStorage.setItem("spda_draft",JSON.stringify(R));}catch(_){}}
function loadDraft(){try{const s=localStorage.getItem("spda_draft");if(s)return JSON.parse(s);}catch(_){}return null;}

function hydrate(){
  document.querySelectorAll("[data-path]").forEach(el=>{const v=getP(R,el.dataset.path);el.value=(v==null?"":v);});
  ["captores","descidas","continuidade","instrumentos","fotos"].forEach(renderList);
  renderNCManuais();
  // foto do aterramento
  const p="aterramento.foto",v=R.aterramento.foto,t=document.getElementById("thumb-"+p.replace(/\./g,"_"));
  if(t){if(v){t.style.display="flex";t.innerHTML=`<img src="${v}"><button class="iconbtn" onclick="clearPhotoPath('${p}')">✕</button>`;}else{t.style.display="none";t.innerHTML="";}}
  syncBrand();computeStatus();computePeriodicidade();computeDescidas();
}

/* feedback em tela (funciona em qualquer navegador, inclusive no preview) */
function toast(m){const t=document.getElementById("toast");if(!t)return;t.textContent=m;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2800);}
let _yes=null;
function confirmBox(m,onYes){const mo=document.getElementById("modal");document.getElementById("modalMsg").textContent=m;_yes=onYes;mo.classList.add("show");}
function _closeModal(){document.getElementById("modal").classList.remove("show");_yes=null;}

function imprimir(){try{window.print();}catch(_){toast("Impressão bloqueada aqui. Baixe o app e gere o PDF no Safari.");}}

function salvarJSON(){
  try{
    const nome=(R.meta.numero||"relatorio-spda").replace(/[^\w\-]+/g,"_");
    const blob=new Blob([JSON.stringify(R,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=nome+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast("Salvo: "+nome+".json");
  }catch(_){toast("Download bloqueado no preview. Baixe o app e use no Safari.");}
}
function abrirJSON(input){const f=input.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=e=>{try{const d=JSON.parse(e.target.result);R=Object.assign(novo(),d);hydrate();autosave();go("capa");toast("Relatório carregado");}
    catch(_){toast("Arquivo inválido. Use um .json gerado por este app.");}input.value="";};rd.readAsText(f);}
function novoRelatorio(){confirmBox("Iniciar um novo relatório? Os dados atuais serão limpos (salve antes, se precisar).",
  ()=>{R=novo();hydrate();go("capa");autosave();toast("Novo relatório iniciado");});}

/* ---------------- periodicidade (multi-edição) ---------------- */
const ENQ_1ANO=["Área classificada (zonas 0/1/20/21)","Munição / explosivos / tóxicos","Corrosão atmosférica severa","Serviços essenciais"];
function intervaloInspecao(){return R.instalacao.enquadramento?(ENQ_1ANO.includes(R.instalacao.enquadramento)?1:3):null;}

function periodMode(){
  const ins=R.instalacao;
  if(ins.criterioLaudo==="Norma de origem (7.3.3) + ressalvas"){
    if(ins.normaOrigem==="NBR 5419:2015")return "2015";
    if(ins.normaOrigem==="NBR 5419:2005"||ins.normaOrigem==="NBR 5419:2001"||ins.normaOrigem==="Anterior a 2001")return "2005";
  }
  return "2026";
}

function periodInfo(){
  const ins=R.instalacao, m=periodMode();
  if(m==="2015"){
    if(!ins.nivel||!ins.tipoInspecao)return {msg:"Selecione NP e tipo de inspeção"};
    const g12=(ins.nivel==="I"||ins.nivel==="II");
    let anos;
    if(ins.tipoInspecao==="Completa (sistema crítico)")anos=1;
    else if(ins.tipoInspecao==="Visual")anos=g12?1:2;
    else anos=g12?2:4;
    return {anos, ed:"NBR 5419-3:2015", cl:"Tabela E.2 — ref.", nota:"Valores de referência (base IEC 62305-3); confirme a edição aplicada."};
  }
  if(m==="2005"){
    const map={"Residencial / comercial / industrial comum":5,"Concentração pública / indústria com risco de explosão / depósito inflamável":3,"Munição / explosivos / corrosão atmosférica severa":1};
    if(!ins.tipoEstrutura)return {msg:"Selecione a classe da estrutura (ed. 2005/2001)"};
    return {anos:map[ins.tipoEstrutura], ed:"NBR 5419:2005", nota:"Inspeção visual anual complementar."};
  }
  const anos=intervaloInspecao();
  if(!anos)return {msg:"Selecione o enquadramento da estrutura"};
  return {anos, ed:"NBR 5419-3:2026", cl:"7.3.2 f"};
}

function computePeriodicidade(){
  syncPeriodMode();
  const el=document.getElementById("periodBadge");
  const pin=document.querySelector('[data-path="instalacao.periodicidade"]');
  const info=periodInfo();
  if(info.msg){R.instalacao.periodicidade="";if(pin)pin.value="";if(el)el.innerHTML=`<span class="chip" style="color:var(--muted)">${info.msg}</span>`;autosaveDeb();return;}
  const anos=info.anos;
  R.instalacao.periodicidade=`A cada ${anos} ano${anos>1?"s":""} — ${info.ed}${info.cl?" ("+info.cl+")":""}`;
  if(pin)pin.value=R.instalacao.periodicidade;
  let prox="";
  if(R.meta.data){const d=new Date(R.meta.data+"T00:00:00");if(!isNaN(d)){d.setFullYear(d.getFullYear()+anos);prox=d.toISOString().slice(0,10);}}
  if(prox){R.instalacao.dataProxima=prox;const din=document.querySelector('[data-path="instalacao.dataProxima"]');if(din)din.value=prox;}
  if(el)el.innerHTML=`<span class="chip"><b>Reinspeção a cada ${anos} ano${anos>1?"s":""}</b></span>`+
    ` <span class="chip">${info.ed}</span>`+
    (prox?` <span class="chip">Próxima: <b>${fmtData(prox)}</b></span>`:` <span class="chip" style="color:var(--muted)">informe a data da inspeção</span>`)+
    (info.nota?` <span class="chip" style="color:var(--warn)">${info.nota}</span>`:"");
  autosaveDeb();
}

function syncPeriodMode(){
  const m=periodMode();
  const d26=document.getElementById("drv2026"), d05=document.getElementById("drv2005"), h=document.getElementById("periodHint");
  if(d26)d26.style.display=(m==="2026")?"":"none";
  if(d05)d05.style.display=(m==="2005")?"":"none";
  if(h){
    if(m==="2015")h.innerHTML=`<b>Ed. 2015 (por NP + tipo):</b> NP I/II — visual 1 ano, completa 2 anos; NP III/IV — visual 2 anos, completa 4 anos; sistema crítico 1 ano. Inspeção visual anual. Valores de referência (Tabela E.2 / IEC 62305-3) — edite se necessário.`;
    else if(m==="2005")h.innerHTML=`<b>Ed. 2005/2001 (por tipo de estrutura):</b> 5 anos — residencial/comercial/industrial comum; 3 anos — concentração pública, indústria com risco de explosão, depósito inflamável; 1 ano — munição/explosivos ou corrosão severa. Inspeção visual anual.`;
    else h.innerHTML=`<b>1 ano:</b> áreas classificadas (zonas 0/1/20/21), explosivos/tóxicos, corrosão atmosférica severa, serviços essenciais. <b>3 anos:</b> demais estruturas. Fora do prazo, reinspecionar após descarga direta, atuação de DPS ou reforma significativa.`;
  }
}

function computeDescidas(){
  const el=document.getElementById("descidasHelp");if(!el)return;
  const esp={"I":10,"II":10,"III":15,"IV":20}[R.instalacao.nivel];
  const per=parseFloat(String(R.instalacao.perimetro).replace(",","."));
  if(!esp||!(per>0)){el.innerHTML=`<span class="chip" style="color:var(--muted)">Informe NP e perímetro para calcular o nº mínimo de descidas</span>`;return;}
  const n=Math.max(2,Math.ceil(per/esp));
  el.innerHTML=`<span class="chip"><b>Mínimo ${n} descidas</b></span> <span class="chip">${per} m ÷ ${esp} m (NP ${R.instalacao.nivel}), nunca menos de 2</span>`;
}

/* ---------------- capa/rodapé de impressão ---------------- */
function fillPrint(nc){
  nc=nc||collectNC();
  const e=R.empresa,c=R.cliente,m=R.meta,ins=R.instalacao,p=R.parecer;
  const sit=p.situacao||(nc.length?"Não conforme — verificar apontamentos":"Conforme");
  const logo=e.logo?`<img src="${e.logo}" alt="">`:`<span class="spark" style="width:44px;height:44px"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#000"/></svg></span>`;
  document.getElementById("printCover").innerHTML=`
    <div class="pc-brand">${logo}<div><div style="font-size:18px;font-weight:700">${esc(e.nome||"—")}</div>
      <div style="font-size:11px;color:#555">${esc(e.crea||"")}${e.contato?" · "+esc(e.contato):""}</div></div></div>
    <h1>Relatório de Inspeção de SPDA</h1>
    <div class="pc-sub">Sistema de Proteção contra Descargas Atmosféricas · ABNT NBR 5419${ins.normaOrigem?" · origem: "+esc(ins.normaOrigem):""}</div>
    <div class="pc-grid">
      <div class="f"><b>Cliente</b><span>${esc(c.nome||"—")}</span></div>
      <div class="f"><b>Documento</b><span>${esc(m.numero||"—")} · rev. ${esc(m.revisao||"00")}</span></div>
      <div class="f"><b>Instalação</b><span>${esc(c.endereco||"—")}</span></div>
      <div class="f"><b>Data da inspeção</b><span>${fmtData(m.data)}</span></div>
      <div class="f"><b>Nível de proteção</b><span>${esc(ins.nivel||"—")}</span></div>
      <div class="f"><b>Tipo de inspeção</b><span>${esc(ins.tipoInspecao||"—")}</span></div>
      <div class="f"><b>Próxima inspeção</b><span>${fmtData(ins.dataProxima)}${ins.periodicidade?" · "+esc(ins.periodicidade):""}</span></div>
      <div class="f"><b>Responsável técnico</b><span>${esc(p.responsavel||e.resp||"—")}</span></div>
      <div class="f"><b>CREA / ART</b><span>${esc(p.crea||e.crea||"—")}${p.art?" · ART "+esc(p.art):""}</span></div>
    </div>
    <div class="pc-verdict">${esc(sit)}${nc.length?`  ·  ${nc.length} não conformidade(s)`:""}</div>`;
  document.getElementById("printFoot").innerHTML=
    `${esc(e.nome||"")} · ${esc(m.numero||"")} · Emitido em ${fmtData(p.dataEmissao)} · Relatório de inspeção de SPDA conforme ABNT NBR 5419`;
}

/* ---------------- init ---------------- */
window.onbeforeprint=()=>fillPrint();
document.addEventListener("DOMContentLoaded",()=>{
  renderTabs();buildPanels();bindScalars();
  document.getElementById("modalYes").onclick=()=>{const f=_yes;_closeModal();if(f)f();};
  document.getElementById("modalNo").onclick=_closeModal;
  document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")_closeModal();});
  const d=loadDraft();if(d)R=Object.assign(novo(),d);
  hydrate();
});
</script>
